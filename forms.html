<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <h1>Forms</h1>
    <form action="/submit" method="post">
    <!--form elements go here-->
    <label for="username">Username</label>
    <input type="text" name="username" id="username" required pattern="[A-Za-z]{4,10}" title="username mustbe 4-10 letters"> <!--in the required pattern,Correct regex: pattern="[A-Za-z]{4,10}"
→ This means “only letters, between 4 and 10 characters long-->
    <label for="email">Email</label>
    <input type="email" name="email" required>
    <label for="password">Password</label>
    <input type="password" name="password" required>
    <label for="Age">age</label>
    <input type="number" name="age" id="age" required min="18" max="65">
    <!--radio buttons-->
    <h3>Gender:</h3>
    <label for="male">Male</label>
    <input type="radio" name="gender" id="male" value="male">
    <label for="female">Female</label>
    <input type="radio" name="gender" id="female" value="female">
    <!--checkboxes-->
    <h3>Interests</h3>
    <label for="coding">Coding</label>
    <input type="checkbox" name="Coding" value="Coding">
    <label for="Dancing">Dancing</label>
    <input type="checkbox" name="Dancing" value="Dancing">
    <label for="swimming">Swimming</label>
    <input type="checkbox" name="swimming" value="swimming">
    <!--select dropdown-->
    <label for="country">Country</label>
    <select name="country" id="country">
    <option value="">Select a country</option> <!--pre-selection-->
    <option value="morocco">Morocco</option>
    <option value="madagascar">Madagascar</option>
    <option value="ethiopia">Ethiopia</option>
    <option value="zambia">Zambia</option>
    </select>
    <label for="message">Message</label> <br> <br>
    <textarea name="message" id="message" rows="6" columns="70"></textarea>
    <input type="submit" name="submit" id="submit"> <br><br>
    </form>
    <!--date picker-->
    <label for="dob">Date of Birth</label>
    <input type="date" name="dob" id="dob"> <br> <br>
    <!--range slider-->
    <label for="volume">Volume</label>
    <input type="range" name="volume" id="volume" min="0" max="100" step="1" value="50"> <br> <br>
    <!--color picker-->
    <label for="color">Choose a color</label>
    <input type="color" name="color" id="color"> <br> <br>
    
</body>
</html>
